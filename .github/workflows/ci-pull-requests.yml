name: PRs CI Workflow
on:
  pull_request:
concurrency:
  group: gh-ref-${{ github.ref }}
  cancel-in-progress: true
jobs:
  format-check:
    uses: ./.github/workflows/flake-formatting-check.yml
    secrets: inherit
  flake-tests:
    uses: ./.github/workflows/flake-tests.yml
    secrets: inherit
  verify-pr-commit:
    uses: ./.github/workflows/verify-pr-commit.yml
    secrets: inherit
  verify-reuse-compliance:
    uses: ./.github/workflows/verify-reuse-compliance.yml
    secrets: inherit
